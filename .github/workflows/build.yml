name: Build CaramOS ISO

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ISO (${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }})
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Bootstrap Arch container
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso make git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CaramOS ISO
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Building release from tag ${GITHUB_REF_NAME}"
            AIROOTFS_IMAGE_TOOL_OPTIONS='-comp xz -Xbcj x86 -b 1M -Xdict-size 1M' \
              mkarchiso -v -w /work -o "$PWD/out" "$PWD/profile"
          else
            echo "Building dev ISO"
            mkarchiso -v -w /work -o "$PWD/out" "$PWD/profile"
          fi

      - name: Generate checksums
        run: sha256sum out/caramos-*.iso > out/SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaramOS-ISO
          path: |
            out/caramos-*.iso
            out/SHA256SUMS
          retention-days: 7

      - name: Upload ISO to SourceForge
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_PROJECT: ${{ secrets.SOURCEFORGE_PROJECT }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          ISO_FILE="$(ls out/caramos-*.iso | head -n 1)"
          ISO_BASENAME="$(basename "${ISO_FILE}")"

          if [ -z "${SOURCEFORGE_USERNAME}" ] || [ -z "${SOURCEFORGE_PROJECT}" ] || [ -z "${SOURCEFORGE_SSH_KEY}" ]; then
            echo "::error::Configure SOURCEFORGE_USERNAME, SOURCEFORGE_PROJECT, and SOURCEFORGE_SSH_KEY secrets to publish on SourceForge."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SOURCEFORGE_SSH_KEY}" > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          RELEASE_DIR="/home/frs/project/${SOURCEFORGE_PROJECT}/${GITHUB_REF_NAME}"
          cat > upload-release.sftp <<EOF
          -mkdir ${RELEASE_DIR}
          cd ${RELEASE_DIR}
          put ${ISO_FILE}
          put SHA256SUMS
          EOF

          sftp -i ~/.ssh/sourceforge \
            -o IdentitiesOnly=yes \
            -b upload-release.sftp \
            "${SOURCEFORGE_USERNAME}@frs.sourceforge.net"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/SHA256SUMS
          append_body: true
          generate_release_notes: true
